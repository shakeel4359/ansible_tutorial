---

- hosts: all
  become: true
  tasks:

    - name: update repository index
      dnf:
        update_cache: yes

    - name: install httpd package
      dnf:
        name: httpd
        state: latest

    - name: add php support for httpd
      dnf:
        name: php, php-fpm, php-mysqlnd, php-json, php-mbstring, php-xml, php-zip
        state: latest
